name: cv_flutter_david
description: Application Flutter CV professionnelle, famille et coordonnées de Ciza Elmalamu David (ISIG-Goma, CS MALKIA, DUNDA Production).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
